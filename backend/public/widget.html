<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat Widget</title>
    <style>
        /* Widget Container */
        .chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        /* Chat Button */
        .chat-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chat-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(0,0,0,0.2);
        }

        .chat-button.typing::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #fff;
            animation: typing 1.4s infinite;
        }

        @keyframes typing {
            0%, 60%, 100% { opacity: 0.3; }
            30% { opacity: 1; }
        }

        /* Chat Window */
        .chat-window {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: 350px;
            height: 500px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-window.open {
            display: flex;
        }

        /* Header */
        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .chat-header h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }

        .chat-status {
            display: flex;
            align-items: center;
            font-size: 12px;
        }

        .status-indicator {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            margin-right: 6px;
        }

        .status-indicator.human {
            background: #f59e0b;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            padding: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Messages Area */
        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: #f8fafc;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            align-items: flex-start;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.agent .message-content {
            background: white;
            color: #374151;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 4px;
        }

        .message.typing .message-content {
            background: white;
            border: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .typing-dots {
            display: flex;
            gap: 2px;
        }

        .typing-dots span {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #9ca3af;
            animation: typing-dots 1.4s infinite;
        }

        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing-dots {
            0%, 60%, 100% { opacity: 0.3; transform: scale(0.8); }
            30% { opacity: 1; transform: scale(1); }
        }

        /* Input Area */
        .chat-input {
            padding: 15px 20px;
            background: white;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        .chat-input input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input input:focus {
            border-color: #667eea;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }

        .send-btn:hover {
            transform: scale(1.1);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Fallback to Human */
        .human-fallback {
            background: #fef3c7;
            border: 1px solid #f59e0b;
            border-radius: 8px;
            padding: 12px;
            margin: 10px 0;
            display: none;
        }

        .human-fallback.show {
            display: block;
        }

        .human-fallback h4 {
            margin: 0 0 8px 0;
            color: #92400e;
            font-size: 14px;
        }

        .human-fallback p {
            margin: 0 0 10px 0;
            color: #92400e;
            font-size: 12px;
        }

        .human-actions {
            display: flex;
            gap: 8px;
        }

        .human-btn {
            background: #f59e0b;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .human-btn:hover {
            background: #d97706;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .chat-window {
                width: calc(100vw - 40px);
                height: calc(100vh - 120px);
                bottom: 70px;
            }
        }

        /* Loading States */
        .loading {
            opacity: 0.7;
            pointer-events: none;
        }

        /* Error States */
        .error-message {
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #dc2626;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="chat-widget">
        <!-- Chat Button -->
        <button class="chat-button" id="chatButton" title="Chat with us">
            💬
        </button>

        <!-- Chat Window -->
        <div class="chat-window" id="chatWindow">
            <!-- Header -->
            <div class="chat-header">
                <div>
                    <h3>AI Assistant</h3>
                    <div class="chat-status">
                        <div class="status-indicator" id="statusIndicator"></div>
                        <span id="statusText">Online</span>
                    </div>
                </div>
                <button class="close-btn" id="closeBtn">×</button>
            </div>

            <!-- Messages -->
            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be inserted here -->
            </div>

            <!-- Human Fallback -->
            <div class="human-fallback" id="humanFallback">
                <h4>🤖 AI Assistant</h4>
                <p>I'm having trouble with your request. Would you like to speak with a human agent?</p>
                <div class="human-actions">
                    <button class="human-btn" id="connectHuman">Connect to Human</button>
                    <button class="human-btn" id="tryAgain">Try Again</button>
                </div>
            </div>

            <!-- Input -->
            <div class="chat-input">
                <input type="text" id="messageInput" placeholder="Type your message..." maxlength="500">
                <button class="send-btn" id="sendBtn">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        class ChatWidget {
            constructor() {
                this.isOpen = false;
                this.sessionId = this.generateSessionId();
                this.isTyping = false;
                this.isHumanMode = false;
                this.messageQueue = [];
                this.retryCount = 0;
                this.maxRetries = 3;

                this.init();
            }

            init() {
                this.bindEvents();
                this.addWelcomeMessage();
                this.updateStatus();
            }

            bindEvents() {
                // Toggle chat window
                document.getElementById('chatButton').addEventListener('click', () => {
                    this.toggleChat();
                });

                document.getElementById('closeBtn').addEventListener('click', () => {
                    this.closeChat();
                });

                // Send message
                document.getElementById('sendBtn').addEventListener('click', () => {
                    this.sendMessage();
                });

                document.getElementById('messageInput').addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') {
                        this.sendMessage();
                    }
                });

                // Human fallback
                document.getElementById('connectHuman').addEventListener('click', () => {
                    this.connectToHuman();
                });

                document.getElementById('tryAgain').addEventListener('click', () => {
                    this.hideHumanFallback();
                    this.retryLastMessage();
                });
            }

            generateSessionId() {
                return 'widget-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
            }

            toggleChat() {
                this.isOpen = !this.isOpen;
                const chatWindow = document.getElementById('chatWindow');
                const chatButton = document.getElementById('chatButton');

                if (this.isOpen) {
                    chatWindow.classList.add('open');
                    chatButton.classList.add('typing');
                    document.getElementById('messageInput').focus();
                } else {
                    chatWindow.classList.remove('open');
                    chatButton.classList.remove('typing');
                }
            }

            closeChat() {
                this.isOpen = false;
                document.getElementById('chatWindow').classList.remove('open');
                document.getElementById('chatButton').classList.remove('typing');
            }

            addWelcomeMessage() {
                const welcomeMessage = {
                    type: 'agent',
                    content: 'Hello! I\'m your AI assistant. How can I help you today?',
                    timestamp: new Date()
                };
                this.addMessage(welcomeMessage);
            }

            addMessage(message) {
                const messagesContainer = document.getElementById('chatMessages');
                const messageElement = document.createElement('div');
                messageElement.className = `message ${message.type}`;

                const contentElement = document.createElement('div');
                contentElement.className = 'message-content';

                if (message.type === 'typing') {
                    contentElement.innerHTML = `
                        <div class="typing-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    `;
                } else {
                    contentElement.textContent = message.content;
                }

                messageElement.appendChild(contentElement);
                messagesContainer.appendChild(messageElement);
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }

            async sendMessage() {
                const input = document.getElementById('messageInput');
                const message = input.value.trim();
                
                if (!message || this.isTyping) return;

                // Clear input
                input.value = '';

                // Add user message
                this.addMessage({
                    type: 'user',
                    content: message,
                    timestamp: new Date()
                });

                // Show typing indicator
                this.showTyping();

                try {
                    const response = await this.callAPI(message);
                    
                    if (response.error) {
                        this.handleError(response.error);
                    } else if (response.reply) {
                        this.hideTyping();
                        this.addMessage({
                            type: 'agent',
                            content: response.reply,
                            timestamp: new Date()
                        });
                        this.retryCount = 0;
                    } else {
                        this.handleNoResponse();
                    }
                } catch (error) {
                    console.error('API Error:', error);
                    this.handleError('Connection error. Please try again.');
                }
            }

            async callAPI(message) {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        message: message,
                        sessionId: this.sessionId,
                        lang: 'en' // Detect language or use default
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                return await response.json();
            }

            showTyping() {
                this.isTyping = true;
                this.addMessage({
                    type: 'typing',
                    content: '',
                    timestamp: new Date()
                });
                this.updateStatus('Typing...');
            }

            hideTyping() {
                this.isTyping = false;
                const typingMessage = document.querySelector('.message.typing');
                if (typingMessage) {
                    typingMessage.remove();
                }
                this.updateStatus();
            }

            handleError(error) {
                this.hideTyping();
                this.retryCount++;

                if (this.retryCount >= this.maxRetries) {
                    this.showHumanFallback();
                } else {
                    this.addMessage({
                        type: 'agent',
                        content: `Sorry, I'm having trouble. Please try again. (Attempt ${this.retryCount}/${this.maxRetries})`,
                        timestamp: new Date()
                    });
                }
            }

            handleNoResponse() {
                this.hideTyping();
                this.retryCount++;

                if (this.retryCount >= this.maxRetries) {
                    this.showHumanFallback();
                } else {
                    this.addMessage({
                        type: 'agent',
                        content: 'I didn\'t receive a response. Please try again.',
                        timestamp: new Date()
                    });
                }
            }

            showHumanFallback() {
                document.getElementById('humanFallback').classList.add('show');
                this.updateStatus('Human Agent', true);
            }

            hideHumanFallback() {
                document.getElementById('humanFallback').classList.remove('show');
                this.updateStatus();
            }

            connectToHuman() {
                this.isHumanMode = true;
                this.addMessage({
                    type: 'agent',
                    content: 'Connecting you to a human agent. Please wait...',
                    timestamp: new Date()
                });

                // Simulate human connection
                setTimeout(() => {
                    this.addMessage({
                        type: 'agent',
                        content: 'Hi! I\'m Sarah, your human agent. How can I help you today?',
                        timestamp: new Date()
                    });
                }, 2000);

                this.hideHumanFallback();
            }

            retryLastMessage() {
                // Retry the last message
                const lastUserMessage = document.querySelector('.message.user:last-child .message-content');
                if (lastUserMessage) {
                    const message = lastUserMessage.textContent;
                    this.sendMessage(message);
                }
            }

            updateStatus(status = 'Online', isHuman = false) {
                const statusIndicator = document.getElementById('statusIndicator');
                const statusText = document.getElementById('statusText');

                if (isHuman) {
                    statusIndicator.classList.add('human');
                    statusText.textContent = status || 'Human Agent';
                } else {
                    statusIndicator.classList.remove('human');
                    statusText.textContent = status || 'Online';
                }
            }
        }

        // Initialize widget when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            window.chatWidget = new ChatWidget();
        });

        // Export for external use
        window.ChatWidget = ChatWidget;
    </script>
</body>
</html>
